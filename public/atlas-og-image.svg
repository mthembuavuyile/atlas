<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Vylex Navy Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051B38" />
      <stop offset="60%" stop-color="#031227" />
      <stop offset="100%" stop-color="#020B18" />
    </linearGradient>

    <!-- Official Vylex Gold Gradient -->
    <linearGradient id="vylexGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBA919" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#FBA919" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#0A2E5C" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#020B18" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Navy Canvas -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#centerGlow)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />

    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
  </g>

  <!-- Official Recognisable Atlas Logo Symbol (Centered at x=600) -->
  <g transform="translate(460, 66) scale(2.8)">
    <path d="M 50 10 L 82 82 L 64 82 L 50 48 L 36 82 L 18 82 Z" fill="url(#vylexGold)" />
    <rect x="45" y="56" width="10" height="26" rx="2" fill="url(#vylexGold)" />
    <ellipse cx="50" cy="50" rx="46" ry="12" stroke="url(#vylexGold)" stroke-width="3.8" fill="none" transform="rotate(-18 50 50)" />
  </g>

  <!-- Centered Brand Wordmark -->
  <text x="600" y="438" text-anchor="middle" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">Atlas</text>

  <!-- Centered Subtitle -->
  <text x="600" y="492" text-anchor="middle" fill="#FBA919" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="3">SCIENTIFIC INTELLIGENCE</text>

  <text x="600" y="534" text-anchor="middle" fill="#94A3B8" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" letter-spacing="0.5">by Vylex Technologies</text>
</svg>
