<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051B38" />
      <stop offset="60%" stop-color="#031227" />
      <stop offset="100%" stop-color="#020B18" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="vylexGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBA919" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="amberGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FBA919" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#051B38" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0A2E5C" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#020B18" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#amberGlow)" />
  <rect width="1200" height="630" fill="url(#blueGlow)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />

    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" fill="none" />

  <!-- Top Pill / Status Tag -->
  <g transform="translate(100, 96)">
    <rect width="320" height="40" rx="20" fill="rgba(10, 46, 92, 0.6)" stroke="rgba(251, 169, 25, 0.3)" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#FBA919" />
    <text x="42" y="25" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">VYLEX TECHNOLOGIES</text>
  </g>

  <!-- Center-Left Content -->
  <!-- Atlas Logo Symbol -->
  <g transform="translate(100, 170)">
    <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
      <path d="M 50 10 L 82 82 L 64 82 L 50 48 L 36 82 L 18 82 Z" fill="url(#vylexGold)" />
      <rect x="45" y="56" width="10" height="26" rx="2" fill="url(#vylexGold)" />
      <ellipse cx="50" cy="50" rx="46" ry="12" stroke="url(#vylexGold)" stroke-width="3.5" fill="none" transform="rotate(-18 50 50)" />
    </svg>
    <text x="124" y="74" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">Atlas</text>
  </g>

  <!-- Tagline and Description -->
  <text x="100" y="325" fill="#FBA919" font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.2">
    Scientific Intelligence &amp; Technical Reasoning Workspace
  </text>
  
  <text x="100" y="375" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" line-height="1.5">
    Multi-model inference, deterministic tools, KaTeX mathematical derivations,
  </text>
  <text x="100" y="408" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" line-height="1.5">
    split-screen code artifact canvas, and verified computational action execution.
  </text>

  <!-- Bottom Capability Badges -->
  <g transform="translate(100, 480)">
    <!-- Badge 1 -->
    <g>
      <rect width="180" height="42" rx="8" fill="rgba(10, 46, 92, 0.45)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="20" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">19 Live Data Tools</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(200, 0)">
      <rect width="190" height="42" rx="8" fill="rgba(10, 46, 92, 0.45)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="20" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">KaTeX Math &amp; Science</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(410, 0)">
      <rect width="180" height="42" rx="8" fill="rgba(10, 46, 92, 0.45)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="20" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Artifacts Canvas</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(610, 0)">
      <rect width="210" height="42" rx="8" fill="rgba(10, 46, 92, 0.45)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="20" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Multi-Model OpenRouter</text>
    </g>
  </g>

  <!-- Bottom Right Footer Stamp -->
  <g transform="translate(860, 545)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">vylex.co.za/docs</text>
  </g>
</svg>
